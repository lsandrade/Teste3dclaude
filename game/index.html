<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- page:start -->
<title>X Bot Arena</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600&family=IBM+Plex+Sans:wght@400;500&display=swap">
<style>
  /* Layout: full-bleed game canvas; HUD pinned to the corners inside the safe area; touch controls only on coarse pointers. */
  :root {
    --night: #0e1626;
    --glass: rgba(14, 22, 38, 0.62);
    --edge: rgba(159, 183, 255, 0.22);
    --ink: #e6ecff;
    --dim: #93a1c4;
    --ember: #ff8f4a;
    --ice: #7fd4ff;
    --hud: "Chakra Petch", "Arial Narrow", Arial, sans-serif;
    --body: "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif;
    color-scheme: dark;
  }
  html, body { height: 100%; margin: 0; background: var(--night); color: var(--ink); overflow: hidden; }
  body { font-family: var(--body); -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
  #game:active { cursor: grabbing; }

  .hud { position: fixed; pointer-events: none; display: flex; gap: 10px; }
  .top {
    top: calc(env(safe-area-inset-top, 0px) + 12px);
    left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px));
    justify-content: space-between; align-items: flex-start;
  }
  .chip { background: var(--glass); border: 1px solid var(--edge); border-radius: 10px; padding: 8px 12px; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
  .title { font-family: var(--hud); font-weight: 600; letter-spacing: 0.14em; font-size: 0.95rem; text-transform: uppercase; }
  .title small { display: block; font-family: var(--body); font-weight: 400; letter-spacing: 0.02em; text-transform: none; color: var(--dim); font-size: 0.72rem; margin-top: 2px; }
  .stats { display: flex; gap: 14px; align-items: center; font-family: var(--hud); }
  .stat { display: flex; flex-direction: column; align-items: flex-end; line-height: 1.1; }
  .stat span { font-size: 0.62rem; letter-spacing: 0.16em; color: var(--dim); text-transform: uppercase; }
  .stat b { font-size: 1.15rem; font-weight: 600; font-variant-numeric: tabular-nums; }
  #score { color: var(--ice); }
  #state { color: var(--ember); font-size: 0.85rem; }

  .keys {
    bottom: calc(env(safe-area-inset-bottom, 0px) + 14px); left: max(16px, env(safe-area-inset-left, 0px));
    flex-wrap: wrap; max-width: min(680px, calc(100vw - 32px)); font-size: 0.75rem; color: var(--dim);
  }
  .keys .chip { display: flex; flex-wrap: wrap; gap: 6px 14px; }
  kbd { font-family: var(--hud); font-weight: 500; color: var(--ink); background: rgba(255,255,255,0.08); border: 1px solid var(--edge); border-bottom-width: 2px; border-radius: 5px; padding: 0 5px; margin-right: 4px; font-size: 0.72rem; }

  .touch { display: none; }
  @media (pointer: coarse) {
    .keys { display: none; }
    .touch { display: block; }
  }
  #pad {
    position: fixed; width: 132px; height: 132px; border-radius: 50%;
    left: calc(max(16px, env(safe-area-inset-left, 0px)) + 8px); bottom: calc(env(safe-area-inset-bottom, 0px) + 28px);
    background: radial-gradient(circle, rgba(127,212,255,0.08), rgba(14,22,38,0.55)); border: 1px solid var(--edge); touch-action: none;
  }
  #knob {
    position: absolute; left: 50%; top: 50%; width: 56px; height: 56px; margin: -28px 0 0 -28px; border-radius: 50%;
    background: rgba(230,236,255,0.2); border: 1px solid rgba(230,236,255,0.45); box-shadow: 0 0 18px rgba(127,212,255,0.25); pointer-events: none;
  }
  .btns {
    position: fixed; right: calc(max(16px, env(safe-area-inset-right, 0px)) + 4px); bottom: calc(env(safe-area-inset-bottom, 0px) + 22px);
    display: grid; grid-template-columns: repeat(3, 62px); gap: 10px; justify-items: center; align-items: end;
  }
  .btns button {
    width: 62px; height: 62px; border-radius: 50%; border: 1px solid var(--edge); background: var(--glass); color: var(--ink);
    font: 600 0.68rem/1.1 var(--hud); letter-spacing: 0.06em; text-transform: uppercase; touch-action: none; padding: 0;
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
  }
  .btns button.big { width: 74px; height: 74px; font-size: 0.78rem; border-color: rgba(255,143,74,0.6); }
  .btns button.on, .btns button.latched { background: rgba(255,143,74,0.35); border-color: var(--ember); }
  .btns button:focus-visible { outline: 2px solid var(--ice); outline-offset: 2px; }

  #loading { position: fixed; inset: 0; display: grid; place-items: center; background: var(--night); font-family: var(--hud); letter-spacing: 0.2em; color: var(--dim); text-transform: uppercase; font-size: 0.85rem; }
  [hidden] { display: none !important; }
</style>
<!-- page:head-end -->
</head>
<body>
<canvas id="game"></canvas>

<div class="hud top">
  <div class="chip title">X Bot Arena<small>personagem e animações do Mixamo</small></div>
  <div class="chip stats">
    <div class="stat"><span>Estado</span><b id="state">parado</b></div>
    <div class="stat"><span>Orbes</span><b id="score">0</b></div>
  </div>
</div>

<div class="hud keys">
  <div class="chip">
    <span><kbd>W A S D</kbd>andar</span>
    <span><kbd>Shift</kbd>correr</span>
    <span><kbd>Espaço</kbd>pular</span>
    <span><kbd>C</kbd>agachar</span>
    <span><kbd>1</kbd>sim</span>
    <span><kbd>2</kbd>não</span>
    <span><kbd>3</kbd>dançar</span>
    <span><kbd>arrastar</kbd>girar câmera</span>
  </div>
</div>

<div class="touch">
  <div id="pad" aria-label="Joystick de movimento"><div id="knob"></div></div>
  <div class="btns">
    <button type="button" id="bYes">Sim</button>
    <button type="button" id="bNo">Não</button>
    <button type="button" id="bDance">Dança</button>
    <button type="button" id="bSneak">Agachar</button>
    <button type="button" id="bRun">Correr</button>
    <button type="button" id="bJump" class="big">Pular</button>
  </div>
</div>

<div id="loading">Carregando personagem…</div>

<script type="importmap">
  { "imports": { "three": "./vendor/three/three.module.min.js", "three/addons/": "./vendor/three/addons/" } }
</script>
<script type="module" src="src/game.js"></script>
</body>
</html>
